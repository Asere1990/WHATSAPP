services:
  - type: web
    name: WHATSAPP
    runtime: docker
    repo: https://github.com/Asere1990/WHATSAPP
    branch: main
    plan: 1c-2g
    region: virginia
    healthCheckPath: /health
    disk:
      name: whatsapp-data
      mountPath: /var/data
      sizeGB: 50
    envVars:
      - key: DATA_DIR
        value: /var/data/whatsapp
      - key: MAX_ACCOUNTS
        value: "3"
      - key: MAX_MEDIA_MB
        value: "20"
      # WhatsApp web panel: persistent offline archive, separate from Telegram limit.
      - key: OFFLINE_MEDIA_MAX_MB
        value: "150"
      - key: OFFLINE_MEDIA_QUOTA_GB
        value: "40"
      - key: TOKEN
        sync: false
      - key: ALMACEN
        value: "-1004466212290"
      - key: CHATS
        value: "-1004461387155"
      - key: ADMIN_CHAT_ID
        value: "-1004466212290"
