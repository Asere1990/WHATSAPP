name: Mini App isolated checks

on:
  push:
    branches:
      - miniapp-whatsapp-cubamax-aislada-20261117
  pull_request:
    paths:
      - 'miniapp/**'
      - 'src/miniapp-bridge.js'
      - 'src/main.js'
      - 'test/miniapp-bridge.test.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply the existing production WhatsApp compatibility patch
        run: node scripts/patch-whatsapp.cjs
      - name: Check existing JavaScript files
        run: npm run check
      - name: Test Telegram Mini App bridge
        run: node --test test/miniapp-bridge.test.js
      - name: Verify all existing WhatsApp tests
        run: npm test
      - name: Verify public Mini App has full client interface
        run: |
          curl --fail --location --silent --show-error --max-time 30 https://whatsapp-cubamax-miniapp.onrender.com/ > /tmp/miniapp.html
          grep -q 'id="create-link"' /tmp/miniapp.html
          grep -q 'id="more-links"' /tmp/miniapp.html
          grep -q 'api/miniapp' /tmp/miniapp.html
      - name: Verify production bridge CORS without any real user data
        run: |
          STATUS=$(curl --silent --show-error --output /tmp/miniapp-options.txt --dump-header /tmp/miniapp-headers.txt --max-time 30 \
            -H "Origin: https://whatsapp-cubamax-miniapp.onrender.com" \
            -H "Access-Control-Request-Method: POST" \
            -X OPTIONS -w "%{http_code}" https://securitywhat.app/api/miniapp)
          test "$STATUS" = "204"
          grep -iq 'access-control-allow-origin: https://whatsapp-cubamax-miniapp.onrender.com' /tmp/miniapp-headers.txt
          STATUS=$(curl --silent --show-error --output /tmp/miniapp-invalid.txt --max-time 30 \
            -H "Origin: https://whatsapp-cubamax-miniapp.onrender.com" \
            -H 'Content-Type: application/json' \
            --data '{"initData":"invalid","action":"start"}' \
            -w "%{http_code}" https://securitywhat.app/api/miniapp)
          test "$STATUS" = "400"

      - name: Verify live private Admin Mini App without any user data
        run: |
          curl --fail --location --silent --show-error --max-time 30 https://whatsapp-cubamax-miniapp.onrender.com/admin.html > /tmp/admin.html
          grep -q 'id="open-web-editor"' /tmp/admin.html
          grep -q 'id="editor-fields"' /tmp/admin.html
          STATUS=$(curl --silent --show-error --output /tmp/admin-options.txt --dump-header /tmp/admin-headers.txt --max-time 30 \
            -H "Origin: https://whatsapp-cubamax-miniapp.onrender.com" \
            -H "Access-Control-Request-Method: POST" \
            -X OPTIONS -w "%{http_code}" https://securitywhat.app/api/miniapp-admin)
          test "$STATUS" = "204"
          grep -iq 'access-control-allow-origin: https://whatsapp-cubamax-miniapp.onrender.com' /tmp/admin-headers.txt
          STATUS=$(curl --silent --show-error --output /tmp/admin-invalid.txt --max-time 30 \
            -H "Origin: https://whatsapp-cubamax-miniapp.onrender.com" \
            -H 'Content-Type: application/json' \
            --data '{"initData":"invalid","action":"home"}' \
            -w "%{http_code}" https://securitywhat.app/api/miniapp-admin)
          test "$STATUS" = "400"
