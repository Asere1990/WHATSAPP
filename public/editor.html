<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#075e54"><title>Editor visual · Administración</title><link rel="stylesheet" href="/editor.css"><script src="/editor.js" defer></script></head><body><section id="locked" hidden><h1>Editor visual</h1><p id="locked-text">Abre el editor desde el privado del bot.</p><a href="/panel">Volver al panel</a></section><main id="editor" hidden><header class="editor-bar"><a href="/panel" aria-label="Volver al panel">‹</a><strong>Editar web<small>🔒 Solo administradores</small></strong><button id="preview" aria-label="Vista previa" title="Vista previa">◉</button><button id="publish" class="publish" disabled>Publicar</button></header><nav class="tools"><select id="site" aria-label="Página"><option value="cm">Cubamax</option><option value="wa">WhatsApp</option></select><a href="/studio">＋ Crear web</a><button id="elements">Elementos</button><select id="popup" aria-label="Abrir popup"><option value="">Popups</option><option value="money">Dinero</option><option value="combo">Combos</option><option value="packages">Paquetes</option><option value="topup">Recargas</option></select><button id="reset-placement" title="Restablecer tamaño y posición del elemento" aria-label="Restablecer tamaño y posición del elemento" hidden>↺</button><button id="size" aria-label="Alternar vista móvil">▯</button></nav><p id="status" role="status">Cargando página…</p><div id="canvas"><iframe id="page" title="Página para editar" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></div><aside id="sheet" hidden><div class="sheet-top"><span class="handle"></span><h2 id="selection-title">Selecciona un elemento</h2><button id="close" aria-label="Cerrar edición">×</button></div><div id="selection"></div><div class="sheet-actions"><button id="save">Guardar borrador</button><button id="discard" class="quiet">Descartar borrador</button></div></aside><dialog id="catalog"><header><h2>Elementos de la página</h2><button id="close-catalog" aria-label="Cerrar elementos">×</button></header><input id="search-fields" type="search" placeholder="Buscar texto, foto o popup" aria-label="Buscar elemento"><div id="field-list"></div></dialog><input id="upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4" hidden></main></body></html>
